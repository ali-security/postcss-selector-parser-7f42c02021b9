name: test
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional ava test file selector; empty runs the full suite'
        required: false
        default: ''

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [14, 16, 18, 20]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: test
        env:
          NODE_OPTIONS: ${{ matrix.node == 20 && '--no-experimental-detect-module' || '' }}
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx ava ${{ inputs.test-filter }}
          else
            npm test
          fi

  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 18.19.0

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: pack
        run: |
          npm i -g npm@10.2.3
          npm pack
          mkdir -p pack-output
          mv postcss-selector-parser-6.1.0.tgz pack-output/

      - uses: actions/upload-artifact@v4
        with:
          name: postcss-selector-parser-tgz
          path: pack-output/postcss-selector-parser-6.1.0.tgz
          if-no-files-found: error
